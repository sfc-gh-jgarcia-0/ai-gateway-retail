[project]
name = "ai-gateway-retail"
version = "0.1.0"
description = "Cortex AI Gateway demo: govern, observe, and optimize LLM calls for retail analytics"
requires-python = ">=3.12.15"
dependencies = [
    "streamlit[snowflake]>=1.54.0",
    "snowflake-connector-python>=3.3.0",
    "snowflake-snowpark-python>=1.20.0",
    "langchain-openai>=0.3.0",
    "langchain-mcp-adapters>=0.1.0",
    "langgraph>=0.4.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
ml = [
    "snowflake-ml-python>=1.7.0",
    "jupyter>=1.0.0",
]

[project.scripts]
live-agent = "ai_gateway_retail.cli.live_agent:main"
generate-traffic = "ai_gateway_retail.cli.generate_traffic:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_gateway_retail"]
